name: MusicVault CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main
      - sprint3-recommendation-integration

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Check backend syntax
        working-directory: backend
        run: node --check src/app.js

      - name: Run automated tests
        working-directory: backend
        run: npm test -- --runInBand

      - name: Create build version
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "BUILD_VERSION=1.0.${GITHUB_RUN_NUMBER}-${SHORT_SHA}" >> "$GITHUB_ENV"

      - name: Show build version
        run: echo "MusicVault Build $BUILD_VERSION"

# Frontend

  frontend-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.2

      - name: Install frontend dependencies
        working-directory: frontend/UI
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend/UI
        run: npm run lint

      - name: Run frontend tests
        working-directory: frontend/UI
        run: npm test

      - name: Build frontend
        working-directory: frontend/UI
        run: npm run build

  # Recommendation Engine

  recommendation-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: recommendation-engine/requirements-dev.txt

      - name: Install Python dependencies
        working-directory: recommendation-engine
        run: python -m pip install -r requirements-dev.txt

      - name: Run Python recommendation tests
        working-directory: recommendation-engine
        run: python -m pytest -v
  # Sprint 4 - SOC 2 CC7.1 Vulnerability Detection

  dependency-security-scan:
    name: Frontend Dependency Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.2

      - name: Install frontend dependencies
        working-directory: frontend/UI
        run: npm ci

      - name: Scan frontend dependencies for vulnerabilities
        working-directory: frontend/UI
        run: npm audit --audit-level=high